name: Update the map

# Renders the map from the game's newest cache, with the renderer in the League Plans repository,
# and opens a pull request with whatever changed, a report of it, and a link to an overview image
# of where it changed. Merging the pull request publishes the tiles. A run whose render matches
# what's published opens no pull request.
#
# Every run renders, which takes about 20 minutes, so there's nothing to force: running it by hand
# renders the newest cache now, such as after a change to the renderer.
#
# The render runs third-party code (the build's plugins and libraries) on a cache from a third
# party's archive, so it gets no write access: it hands its tiles to a second job, which checks
# them and opens the pull request. Neither job saves its token where the steps after checkout can
# read it. Actions are pinned to commits, which Dependabot updates.
on:
  # Thursday mornings: the game updates on Wednesdays, and the archive has the new cache within
  # hours
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-map

jobs:
  render:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      overview: ${{ steps.overview.outputs.artifact-url }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: map-tiles
        persist-credentials: false

    # Only what the renderer is built from, rather than the whole site with its images
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: leagueplans/leagueplans.github.io
        path: planner
        persist-credentials: false
        sparse-checkout: |
          project
          codec
          common
          maprender

    - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      with:
        root: planner

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 17

    - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      with:
        sbt-runner-version: 1.13.0

    # Logs its progress every 15 seconds. Writes report.md and, if any tiles changed, overview.png
    # to the results directory. The runner's paths have no spaces, which sbt's run would split
    # arguments at.
    - name: Render the map
      working-directory: planner
      run: >-
        sbt "mapRenderer/run --latest ${{ runner.temp }}/cache
        ${{ github.workspace }}/map-tiles/docs ${{ runner.temp }}/results"

    - name: Check for changes
      id: changes
      run: |
        if [ -n "$(git -C map-tiles status --porcelain -- docs)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # Unzipped, so that it opens in the browser from the link in the pull request. There's none
    # when only places changed.
    - name: Upload the overview
      id: overview
      if: steps.changes.outputs.changed == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/results/overview.png
        archive: false
        if-no-files-found: ignore

    # All of docs, not only what changed, so that the next job can replace its own with it and
    # leave git to find the changes. With .nojekyll, which is hidden.
    - name: Upload the tiles
      if: steps.changes.outputs.changed == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docs
        path: map-tiles/docs
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

    # With the commit message, whose title names the cache
    - name: Upload the report
      if: steps.changes.outputs.changed == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report
        path: |
          ${{ runner.temp }}/results/report.md
          ${{ runner.temp }}/results/commit-message.txt
        if-no-files-found: error
        retention-days: 1

    - name: Summarise the render
      run: cat "$RUNNER_TEMP/results/report.md" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docs
        path: ${{ runner.temp }}/docs

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: report
        path: ${{ runner.temp }}/report

    # Only tiles and the map's own files are let through, so that nothing else, such as a page or a
    # script, is ever published under the site's domain
    - name: Check the render
      working-directory: ${{ runner.temp }}/docs
      run: |
        unexpected="$(find . -mindepth 1 -regextype posix-extended ! -type d \
          ! \( -type f -regex '\./[0-3]/-?[0-9]+/-?[0-9]+_-?[0-9]+\.png' \) \
          ! \( -type f \( -path ./index.json -o -path ./places.json -o -path ./.nojekyll -o -path ./CNAME \) \))"
        if [ -n "$unexpected" ]; then
          echo "::error::The render has files that aren't tiles or the map's own files"
          echo "$unexpected"
          exit 1
        fi

    - name: Replace the tiles
      run: |
        rm -rf docs
        mv "$RUNNER_TEMP/docs" docs

    - name: Write the report
      id: report
      env:
        OVERVIEW: ${{ needs.render.outputs.overview }}
      run: |
        report="$RUNNER_TEMP/body.md"
        : > "$report"
        if [ -n "$OVERVIEW" ]; then
          printf '**[Overview of the changes](%s)**\n\n' "$OVERVIEW" > "$report"
        fi
        cat "$RUNNER_TEMP/report/report.md" >> "$report"
        message="$RUNNER_TEMP/report/commit-message.txt"
        delimiter="$(openssl rand -hex 8)"
        {
          echo "report<<$delimiter"; cat "$report"; echo "$delimiter"
          echo "message<<$delimiter"; cat "$message"; echo "$delimiter"
          echo "title=$(head -n 1 "$message")"
        } >> "$GITHUB_OUTPUT"

    - name: Open a pull request for any changes
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        commit-message: ${{ steps.report.outputs.message }}
        branch: update-map
        delete-branch: true
        title: ${{ steps.report.outputs.title }}
        body: |
          Rendered by workflow [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). Check the changes in the overview before merging.

          ---

          ${{ steps.report.outputs.report }}
